[package]
name = "vilahack_user_backend"
version = "0.1.1"
edition = "2021"

[dependencies]
# Dealing with the database
diesel = { version = "2.3", features = ["postgres", "uuid", "serde_json"] }
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1.0"
uuid = { version = "1.20", features = ["serde"] }

# Validating user data
url = { version = "2.5", features = ["serde"] }
serde-email = "3.2"
bitflags = { version = "2.10", features = ["serde"] }

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.release]
lto = 'fat' # Perform link time optimizations for the whole dependency graph
codegen-units = 1 # Sacrifice compilation speed for a faster binary

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
